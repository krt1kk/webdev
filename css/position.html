<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARTIK NEGI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ecedef;
      color: #000;
    }

    .grid {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 2%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);

      
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)),
        url("me.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .grid p {
      font-size: clamp(0.9rem, 2.5vw, 2.5rem);
      font-weight: bold;
      white-space: nowrap;
    }

    /* Row 1 */
    .top-left      { align-self: start;  justify-self: start;  }
    .top-center    { align-self: start;  justify-self: center; }
    .top-right     { align-self: start;  justify-self: end;    }

    /* Row 2 */
    .mid-left      { align-self: center; justify-self: start;  }
    .mid-center    { align-self: center; justify-self: center; }
    .mid-right     { align-self: center; justify-self: end;    }

    /* Row 3 */
    .bottom-left   { align-self: end;    justify-self: start;  }
    .bottom-center { align-self: end;    justify-self: center; }
    .bottom-right  { align-self: end;    justify-self: end;    }
  </style>
</head>

<body>

  <div class="grid">
    <p class="top-left">kartik negi</p>
    <p class="top-center">kartik negi</p>
    <p class="top-right">kartik negi</p>

    <p class="mid-left">kartik negi</p>
    <p class="mid-center">kartik negi</p>
    <p class="mid-right">kartik negi</p>

    <p class="bottom-left">kartik negi</p>
    <p class="bottom-center">kartik negi</p>
    <p class="bottom-right">kartik negi</p>
  </div>

</body>
</html>
